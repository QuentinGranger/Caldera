name: QA navigateur & Lighthouse

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Lighthouse + Chromium Firefox WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caldera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caldera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/caldera
      APP_URL: http://localhost:3001
      TEST_BASE_URL: http://localhost:3001
      QA_BASE_URL: http://localhost:3001
      EMAILS_ENABLED: 'false'
      PASSWORD_BREACH_CHECK: 'off'
      NEXT_TELEMETRY_DISABLED: '1'
      CRON_SECRET: cron_local_http_test_only

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Secrets de test
        run: |
          auth="$(openssl rand -hex 32)"
          access="$(openssl rand -hex 32)"
          webhook="whsec_$(openssl rand -hex 24)"
          echo "::add-mask::$auth"
          echo "::add-mask::$access"
          echo "::add-mask::$webhook"
          {
            echo "BETTER_AUTH_SECRET=$auth"
            echo "ORDER_ACCESS_SECRET=$access"
            echo "STRIPE_WEBHOOK_SECRET=$webhook"
            echo "UPLOAD_DIR=$RUNNER_TEMP/uploads"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/uploads"

      - name: Installation application
        run: npm ci

      - name: Outils QA
        run: |
          npm install --no-save --package-lock=false lighthouse@13.0.1 playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium introuvable pour Lighthouse" >&2
            exit 1
          fi
          echo "LH_CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Base de données de test
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build de production
        run: npm run build

      - name: Démarrage du serveur
        run: |
          nohup npm run start -- --port 3001 > "$RUNNER_TEMP/qa-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3001/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/qa-server.log"
          exit 1

      - name: Lighthouse mobile + desktop
        run: node scripts/qa-lighthouse.mjs

      - name: Cross-browser Chromium Firefox WebKit
        if: always()
        run: node scripts/qa-cross-browser.mjs

      - name: Rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: qa-artifacts/lighthouse
          if-no-files-found: ignore
          retention-days: 14

      - name: Journal du serveur
        if: failure()
        run: cat "$RUNNER_TEMP/qa-server.log" || true
